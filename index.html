<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omega City of Mercy - Admin Dashboard</title>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Admin Dashboard Container -->
  <div class="dashboard-container">
    <h1 class="dashboard-title">Admin Dashboard</h1>

    <!-- Main Highlight Card (Total Group Balance) -->
    <div class="card balance-card">
      <h3>Total Group Balance</h3>
      <p id="total-balance">₦0.00</p>
      <small>(Dues + Inflow + Handover - Expenses)</small>
    </div>

    <!-- 2 by 2 Cards Grid -->
    <div class="cards-grid">
      <!-- Card 1 -->
      <div class="card">
        <h4>Total Group Dues</h4>
        <p id="total-dues">₦0.00</p>
      </div>

      <!-- Card 2 -->
      <div class="card">
        <h4>Total Group Inflow</h4>
        <p id="total-inflow" class="text-green">₦0.00</p>
      </div>

      <!-- Card 3 -->
      <div class="card">
        <h4>Total Group Handover</h4>
        <p id="total-handover" class="text-purple">₦0.00</p>
      </div>

      <!-- Card 4 -->
      <div class="card">
        <h4>Total Group Expenses</h4>
        <p id="total-expenses" class="text-red">₦0.00</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
